<!doctype html><html lang="ms"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Misi Huffaz ATM</title><style>body{font:16px system-ui;background:#eef5f0;margin:0;color:#173c2b}header{background:#145b3c;color:white;text-align:center;padding:24px}main{max-width:760px;margin:auto;padding:14px}.card{background:white;margin:12px 0;padding:16px;border-radius:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.unit{background:#e7f1ea;text-align:center;padding:10px 2px;border-radius:8px}.unit strong{display:block;font-size:25px}button{background:#14633e;color:white;border:0;border-radius:6px;padding:8px;margin:4px}button:disabled{opacity:.3}small{display:block}#status{padding:12px;background:#fff2d1;border-radius:8px}</style><header><h1>🪖 MISI HUFFAZ ATM</h1>Operasi Tiga Angkatan · 6 Peserta · 62 Subtajuk</header><main><p id="status">Menyambung Firebase...</p><button id="login">Log masuk Google (Admin)</button><div id="people"></div></main><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';import{getFirestore,collection,onSnapshot,doc,updateDoc}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
const config={apiKey:'AIzaSyCrfS3RtIU-JJrCfmCIRTZ60ZKhU6G72FA',authDomain:'misi-huffaz-atm.firebaseapp.com',projectId:'misi-huffaz-atm',storageBucket:'misi-huffaz-atm.firebasestorage.app',messagingSenderId:'372514850341',appId:'1:372514850341:web:83d8551f6d6a910c8ea1cc'};
const ADMIN_UID='GANTIKAN_DENGAN_UID_ANDA';const app=initializeApp(config),db=getFirestore(app),auth=getAuth(app),labels={darat:'🪖 Darat',laut:'⚓ Laut',udara:'✈️ Udara'};let admin=false,people=[];const status=document.querySelector('#status'),login=document.querySelector('#login'),target=document.querySelector('#people');login.onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>alert(e.message));onAuthStateChanged(auth,u=>{admin=!!u&&u.uid===ADMIN_UID;login.hidden=admin;status.textContent=admin?'Mod pentadbir':u?'Log masuk berjaya. UID anda: '+u.uid:'Mod paparan sahaja';draw()});onSnapshot(collection(db,'peserta'),s=>{people=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true}));draw()},e=>status.textContent='Ralat akses pangkalan data: '+e.message);function draw(){target.replaceChildren();for(const p of people){const card=document.createElement('div');card.className='card';const h=document.createElement('h2');h.textContent=p.nama||p.id;card.append(h);if(admin){const rename=document.createElement('button');rename.textContent='Tukar nama';rename.onclick=async()=>{let n=prompt('Nama',p.nama||'');if(n?.trim())try{await updateDoc(doc(db,'peserta',p.id),{nama:n.trim()})}catch(e){alert(e.message)}};card.append(rename)}const grid=document.createElement('div');grid.className='grid';for(const k of ['darat','laut','udara']){const unit=document.createElement('div');unit.className='unit';const title=document.createElement('div');title.textContent=labels[k];const value=document.createElement('strong');const n=Number(p[k])||0;value.textContent=n;unit.append(title,value);if(admin)for(const delta of [-1,1]){const b=document.createElement('button');b.textContent=delta<0?'−':'+';b.disabled=delta<0&&n<=0;b.onclick=()=>updateDoc(doc(db,'peserta',p.id),{[k]:Math.max(0,n+delta)}).catch(e=>alert(e.message));unit.append(b)}grid.append(unit)}card.append(grid);target.append(card)}}
</script></html>
